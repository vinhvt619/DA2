services:
  - type: web
    name: rabbitcv-realtime
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: node server/server.js
    healthCheckPath: /api/realtime/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_URL
        value: https://rabbitcv.vercel.app
      - key: JWT_SECRET
        sync: false
      - key: REALTIME_SHARED_SECRET
        sync: false
